# 22.7M-parameter TransformerLM on TinyStories (vocab 10k BPE).
# 128 x 256 tokens/step x 10,000 steps = 327,680,000 tokens.
# Optimizer hyperparameters are train.py's defaults; replace them with the values of your
# original run if they differed.

# model
vocab_size: 10000
context_length: 256
d_model: 512
num_layers: 4
num_heads: 16
d_ff: 1344
rope_theta: 10000.0

# optimization
batch_size: 128
max_iters: 10000
lr_max: 3.0e-4
lr_min: 3.0e-5
warmup_iters: 200
weight_decay: 0.1
max_grad_norm: 1.0

# loop
eval_interval: 500
eval_batches: 20
final_eval_batches: 200
ckpt_interval: 2000
log_interval: 50
throughput_warmup: 20
div_k: 3.0
div_window: 100
